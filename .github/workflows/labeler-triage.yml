name: "Pull Request Labeler"

permissions:
  contents: read
  pull-requests: write

on:
- pull_request_target

jobs:
  triage:
    runs-on: cx-public-ubuntu-x64
    steps:
    - uses: actions/labeler@ac9175f8a1f3625fd0d4fb234536d26811351594 # v4.3.0
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"